<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究助手 · RA Console</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/chakra-petch-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <a class="brand" href="#/chat">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 7h18v4.5H11.5V25H7z" fill="currentColor"/>
        <rect x="16" y="16" width="9" height="9" fill="currentColor" opacity=".55"/>
      </svg>
      <span class="brand-name">RA·CONSOLE</span>
      <span class="brand-sub">研究助手</span>
    </a>

    <nav class="topnav" id="topnav" aria-label="主导航">
      <a href="#/chat" data-route="chat">会话</a>
      <a href="#/task" data-route="task">任务</a>
      <a href="#/papers" data-route="papers">文库</a>
      <a href="#/settings" data-route="settings">设置</a>
    </nav>

    <div class="topbar-status" id="conn-status" title="服务连接">
      <span class="conn-dot" id="conn-dot"></span>
      <span class="conn-model" id="model-label">…</span>
    </div>
  </header>

  <main id="main" class="main"></main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
