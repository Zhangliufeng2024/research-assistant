[project]
name = "research-assistant"
version = "3.5.0"
description = "Deep research and writing tool - combines AI-driven deep research with well-formatted written outputs. Supports Anthropic and OpenAI-compatible LLM APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
desktop = ["pywebview>=5.0"]
# PDF→图片转换（.claude/skills/scientific-slides/scripts/pdf_to_images.py）专用
pdf-images = ["pymupdf>=1.24.0"]

# System Dependencies (must be installed separately):
#
# LibreOffice (optional, for .docx to PDF conversion):
#   - macOS: brew install --cask libreoffice
#   - Linux: sudo apt-get install libreoffice
#   - Windows: https://www.libreoffice.org/download/
#
# PDF handling: core PDF text extraction uses pypdf (a declared dependency).
# PDF-to-image conversion needs the optional pymupdf extra:
#   pip install "research-assistant[pdf-images]"
# Packaged desktop builds do NOT bundle pymupdf by default.

[project.scripts]
research-assistant = "research_assistant.cli:cli_main"
research-assistant-web = "research_assistant.web:main"
research-assistant-desktop = "research_assistant.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# TODO: 待生成 uv.lock 锁定依赖（需联网执行 uv lock，本次离线不做）。
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# .claude/ 内是第三方技能脚本（非项目代码），不参与 lint。
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API on purpose.
"__init__.py" = ["F401"]
# importorskip must run before eval imports (yaml is optional at test time).
"tests/test_eval.py" = ["E402"]
