name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff
      # Lint 范围扩到全部自有代码（2026-08-25 本地全量试跑 `ruff check
      # research_assistant tests scripts build.py` 通过）。
      # 扩展前置条件：若 research_assistant/tests 再积累大量存量违规且短期
      # 无法清理，先回退为 `ruff check research_assistant`，勿让 lint 挡合并。
      - name: Lint
        run: ruff check research_assistant tests scripts build.py
      - name: Test
        run: pytest -q

  # 前端线：tsc 类型检查 + vitest（显式一次性运行，防 watch 挂死）+ vite 构建。
  # package.json 的 build = "tsc -b && vite build"，产物直出后端静态目录。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build
